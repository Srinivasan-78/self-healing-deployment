---
# Centralized, environment-agnostic config. Secrets live in vault.yml
# (ansible-vault encrypted) and are never committed in plaintext —
# same separation used for the TR vars.yml/vault.yml architecture.

app_name: demo-service
container_port: 8080
host_port_active: 8080
image_name: demo-service
health_endpoint: /health
health_retries: 5
health_delay_seconds: 2
health_timeout_seconds: 3
health_backoff: 1.5
health_max_response_ms: 1500
deployment_log_path: "{{ playbook_dir }}/../deployment_log/deployments.json"

# Defaults for the deploy inputs. Overridden per-run with
# `-e target_version=... -e force_fail=...` (extra vars win over group_vars).
target_version: v1
force_fail: "false"
